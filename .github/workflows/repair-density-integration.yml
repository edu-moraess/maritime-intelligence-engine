name: Repair tactical density integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'edu-moraess'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply density integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ui/pages_helpers.py')
          text = path.read_text()

          old_import = '''    anomaly_mmsi_sets, build_track_segments, density_points_from_observations,\n    enrich_tactical_rows, legend_markdown, operational_strip,\n'''
          new_import = '''    AIS_TARGETS_LAYER_ID, TACTICAL_MAP_STYLE, TACTICAL_TOOLTIP_HTML, TACTICAL_TOOLTIP_STYLE,\n    anomaly_mmsi_sets, build_density_layer_spec, build_track_segments, density_points_from_observations,\n    enrich_tactical_rows, legend_markdown, operational_strip,\n'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif 'build_density_layer_spec' not in text:
              raise SystemExit('Could not locate tactical_map import block')

          old_density = '''    if show_density:\n        density_source = density_points_from_observations(list(snapshot.observations or []))\n        if density_source:\n            try:\n                layers.append(pdk.Layer("HeatmapLayer", data=density_source, get_position=["longitude","latitude"],\n                    opacity=0.25, radius_pixels=26, aggregation="SUM",\n                    color_range=[[7,17,22,0],[27,64,72,70],[53,194,201,110],[233,184,87,130]], pickable=False))\n            except Exception:\n                layers.append(pdk.Layer("ScatterplotLayer", data=density_source, get_position=["longitude","latitude"],\n                    get_fill_color=[53,194,201,30], get_radius=900, radius_min_pixels=2, radius_max_pixels=8, pickable=False))\n'''
          new_density = '''    if show_density:\n        density_source = density_points_from_observations(\n            list(snapshot.observations or [])\n        )\n        density_spec = build_density_layer_spec(density_source)\n        if density_spec is not None:\n            layers.append(pdk.Layer(**density_spec))\n'''
          if old_density in text:
              text = text.replace(old_density, new_density, 1)
          elif 'HeatmapLayer' in text:
              raise SystemExit('HeatmapLayer is present but expected density block was not found')

          text = text.replace('id="ais-targets"', 'id=AIS_TARGETS_LAYER_ID', 1)

          if 'HeatmapLayer' in text:
              raise SystemExit('HeatmapLayer remains in pages_helpers.py')
          if 'id=AIS_TARGETS_LAYER_ID' not in text:
              raise SystemExit('AIS target layer id integration failed')

          path.write_text(text)
          PY

      - name: Validate
        run: |
          python -m compileall src
          pytest -q

      - name: Commit and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages_helpers.py .github/workflows/repair-density-integration.yml
          git diff --cached --check
          git commit -m "fix: integrate resilient tactical density layer"
          git push origin main
