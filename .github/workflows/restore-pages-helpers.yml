name: Restore pages_helpers.py

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore known-good pages_helpers.py and apply density fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout 92995382446194e0874befb8af910174ad6bed42 -- src/ui/pages_helpers.py
          python - <<'PY'
          from pathlib import Path
          p = Path("src/ui/pages_helpers.py")
          s = p.read_text()

          old_import = '''from src.ui.tactical_map import (\n    TACTICAL_MAP_STYLE, TACTICAL_TOOLTIP_HTML, TACTICAL_TOOLTIP_STYLE,\n    anomaly_mmsi_sets, build_track_segments, density_points_from_observations,\n    enrich_tactical_rows, legend_markdown, operational_strip,\n)'''
          new_import = '''from src.ui.tactical_map import (\n    AIS_TARGETS_LAYER_ID,\n    TACTICAL_MAP_STYLE, TACTICAL_TOOLTIP_HTML, TACTICAL_TOOLTIP_STYLE,\n    anomaly_mmsi_sets, build_density_layer_spec, build_track_segments,\n    density_points_from_observations, enrich_tactical_rows, legend_markdown,\n    operational_strip,\n)'''
          if old_import not in s:
              raise SystemExit("expected tactical_map import block not found")
          s = s.replace(old_import, new_import, 1)

          old_density = '''    if show_density:\n        density_source = density_points_from_observations(list(snapshot.observations or []))\n        if density_source:\n            try:\n                layers.append(pdk.Layer("HeatmapLayer", data=density_source, get_position=["longitude","latitude"],\n                    opacity=0.25, radius_pixels=26, aggregation="SUM",\n                    color_range=[[7,17,22,0],[27,64,72,70],[53,194,201,110],[233,184,87,130]], pickable=False))\n            except Exception:\n                layers.append(pdk.Layer("ScatterplotLayer", data=density_source, get_position=["longitude","latitude"],\n                    get_fill_color=[53,194,201,30], get_radius=900, radius_min_pixels=2, radius_max_pixels=8, pickable=False))'''
          new_density = '''    if show_density:\n        density_source = density_points_from_observations(list(snapshot.observations or []))\n        density_spec = build_density_layer_spec(density_source) if density_source else None\n        if density_spec is not None:\n            try:\n                # Optional visual only — never uses deck.gl KDE heatmap (WebGL shader failures).\n                layers.append(pdk.Layer(\n                    density_spec["type"],\n                    data=density_spec["data"],\n                    get_position=density_spec["get_position"],\n                    get_fill_color=density_spec["get_fill_color"],\n                    get_radius=density_spec["get_radius"],\n                    radius_min_pixels=density_spec["radius_min_pixels"],\n                    radius_max_pixels=density_spec["radius_max_pixels"],\n                    pickable=False,\n                ))\n            except Exception:\n                # Density failure must not break map or selection.\n                pass'''
          if old_density not in s:
              raise SystemExit("expected HeatmapLayer density block not found")
          s = s.replace(old_density, new_density, 1)

          old_layer = 'pdk.Layer("ScatterplotLayer", data=rows, id="ais-targets", get_position=["longitude","latitude"],'
          new_layer = 'pdk.Layer("ScatterplotLayer", data=rows, id=AIS_TARGETS_LAYER_ID, get_position=["longitude","latitude"],'
          if old_layer not in s:
              raise SystemExit("expected AIS target layer id not found")
          s = s.replace(old_layer, new_layer, 1)

          old_selection = 'objects.get("ais-targets") or objects.get("ais_targets")'
          new_selection = 'objects.get(AIS_TARGETS_LAYER_ID) or objects.get("ais_targets")'
          if old_selection not in s:
              raise SystemExit("expected selection layer lookup not found")
          s = s.replace(old_selection, new_selection, 1)

          p.write_text(s)
          if "HeatmapLayer" in s:
              raise SystemExit("HeatmapLayer remains in pages_helpers.py")
          if "build_density_layer_spec" not in s or "AIS_TARGETS_LAYER_ID" not in s:
              raise SystemExit("density/selection integration incomplete")
          PY

      - name: Validate
        run: |
          python -m py_compile src/ui/pages_helpers.py
          python -m compileall -q src

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages_helpers.py
          if git diff --cached --quiet; then
            echo "No pages_helpers.py changes to publish."
            exit 0
          fi
          git commit -m "fix: make tactical map density rendering resilient"
          git push origin HEAD:main
